<div class="container">
    <ngx-particles [id]="id" [options]="particlesOptions" />

    <div class="grid grid-cols-12 authentication authentication-basic items-center h-full place-items-center  z-10 ">
        <div class="col-span-12 px-[0.5rem]">
            <div class="mb-3 flex justify-center auth-logo">
                <a [routerLink]="'/dashboards/sales'">
                    <img src="./assets/images/brand-logos/desktop-dark.png" alt="logo" class="desktop-dark">
                </a>
            </div>
            <div class="box my-6">
                <div class="box-header !border-0 ">
                    <nav class="flex bg-gray-100 hover:bg-gray-200 z-999 rounded-lg transition p-1 dark:bg-black/20 dark:hover:bg-black/20"
                        role="tablist">
                        <a class="w-full sm:w-auto hs-tab-active:bg-primary cursor-pointer hs-tab-active:text-gray-700 dark:hs-tab-active:bg-bgdark dark:hs-tab-active:text-white py-2 px-3 inline-flex justify-center items-center gap-2 bg-transparent text-sm text-gray-500 hover:text-gray-700 font-medium rounded-md hover:hover:text-primary dark:text-white/70 dark:hover:text-white active"
                            id="segment-item-2" data-hs-tab="#segment-1" aria-controls="segment-1">
                            <img class="firebase" src="./assets/images/favicon.svg" alt="">
                        </a>
                        <a class="w-full sm:w-auto hs-tab-active:bg-primary cursor-pointer hs-tab-active:text-gray-700 dark:hs-tab-active:bg-bgdark dark:hs-tab-active:text-white py-2 px-3 inline-flex justify-center items-center gap-2 bg-transparent text-sm text-gray-500 hover:text-gray-700 font-medium rounded-md hover:hover:text-primary dark:text-white/70 dark:hover:text-white "
                            id="segment-item-1" data-hs-tab="#segment-2" aria-controls="segment-2">
                            <img class="firebase" src="./assets/images/firebase.svg" alt="">
                        </a>
                    </nav>
                </div>
                <div class="box-body !p-0  ">
                    <div class="p-[3rem] !pt-2">

                        <div id="segment-1" role="tabpanel" aria-labelledby="segment-item-1">
                            <form [formGroup]="angularLoginForm" (ngSubmit)="Submit()">
                                <div class="text-danger">{{ error }}</div>
                                <div class="flex items-center justify-center mb-3">
                                    <span class="auth-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" id="password">
                                            <path fill="#6446fe"
                                                d="M59,8H5A1,1,0,0,0,4,9V55a1,1,0,0,0,1,1H59a1,1,0,0,0,1-1V9A1,1,0,0,0,59,8ZM58,54H6V10H58Z"
                                                class="color1d1f47 svgShape"></path>
                                            <path fill="#6446fe"
                                                d="M36,35H28a3,3,0,0,1-3-3V27a3,3,0,0,1,3-3h8a3,3,0,0,1,3,3v5A3,3,0,0,1,36,35Zm-8-9a1,1,0,0,0-1,1v5a1,1,0,0,0,1,1h8a1,1,0,0,0,1-1V27a1,1,0,0,0-1-1Z"
                                                class="color0055ff svgShape"></path>
                                            <path fill="#6446fe"
                                                d="M36 26H28a1 1 0 0 1-1-1V24a5 5 0 0 1 10 0v1A1 1 0 0 1 36 26zm-7-2h6a3 3 0 0 0-6 0zM32 31a1 1 0 0 1-1-1V29a1 1 0 0 1 2 0v1A1 1 0 0 1 32 31z"
                                                class="color0055ff svgShape"></path>
                                            <path fill="#6446fe"
                                                d="M59 8H5A1 1 0 0 0 4 9v8a1 1 0 0 0 1 1H20.08a1 1 0 0 0 .63-.22L25.36 14H59a1 1 0 0 0 1-1V9A1 1 0 0 0 59 8zm-1 4H25l-.21 0a1.09 1.09 0 0 0-.42.2L19.73 16H6V10H58zM50 49H14a1 1 0 0 1-1-1V39a1 1 0 0 1 1-1H50a1 1 0 0 1 1 1v9A1 1 0 0 1 50 49zM15 47H49V40H15z"
                                                class="color1d1f47 svgShape"></path>
                                            <circle cx="19.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="24.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="29.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="34.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="39.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="44.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <path fill="#6446fe"
                                                d="M60 9a1 1 0 0 0-1-1H28.81l2.37-2.37A19.22 19.22 0 0 1 60 31zM35.19 56l-2.37 2.37A19.22 19.22 0 0 1 4 33V55a1 1 0 0 0 1 1z"
                                                opacity=".3" class="color0055ff svgShape"></path>
                                        </svg>
                                    </span>
                                </div>
                                <p class="h4 !font-semibold !mb-0 text-center">Sign In</p>
                                <p class="!mb-3 text-textmuted dark:text-textmuted/50  font-normal text-center">Welcome
                                    back
                                    Jhon !</p>
                                <div class="grid grid-cols-12 gap-y-4">
                                    <div class="xl:col-span-12 col-span-12">
                                        <label for="angular-signup-firstname" class="ti-form-label text-default">User
                                            Name</label>
                                        <input type="email" class="form-control form-control-lg !pe-0"
                                            id="angular-signup-firstname" placeholder="User Name" autocomplete
                                            formControlName="username" required>
                                    </div>
                                    <div class="xl:col-span-12 col-span-12">
                                        <label for="signin-password" class="ti-form-label text-default block">Password
                                        </label>
                                        <a href="javascript:void(0);"
                                            class="float-end text-danger opacity-50 font-medium text-[0.75rem]">Forget
                                            password ?</a>
                                        <div class="relative">
                                            <input type="password"
                                                [type]="visibilityMap['Angular'] ? 'text' : 'password'"
                                                formControlName="password" class="form-control form-control-lg"
                                                id="signin-password" autocomplete placeholder="password" autocomplete
                                                required />
                                            <a href="javascript:void(0);"
                                                class="show-password-button text-textmuted dark:text-textmuted/50"
                                                (click)="toggleVisibility('Angular')"><i
                                                    class="{{iconMap['Angular']}}  align-middle"></i></a>

                                        </div>
                                        <div class="mt-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value=""
                                                    id="defaultCheck">
                                                <label
                                                    class="form-check-label text-textmuted dark:text-textmuted/50 font-normal text-[0.75rem]"
                                                    for="defaultCheck">
                                                    Remember password ?
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-center my-4 authentication-barrier">
                                    <span class="opacity-40 text-[0.6875rem]">OR SignIn With</span>
                                </div>
                                <div class="flex items-center justify-center gap-3 mb-3 flex-wrap">
                                    <button type="button" class="ti-btn ti-btn-primary ti-btn-md ti-btn-icon"> <i
                                            class="ti ti-brand-google text-lg"></i>
                                    </button>
                                    <button type="button" class="ti-btn ti-btn-secondary ti-btn-md ti-btn-icon"> <i
                                            class="ti ti-mail  text-lg"></i>
                                    </button>
                                    <button type="button" class="ti-btn ti-btn-success ti-btn-md ti-btn-icon"> <i
                                            class="ti ti-brand-facebook  text-lg"></i>
                                    </button>
                                </div>
                                <div class="grid mt-4">
                                    <button type="submit" [disabled]="!angularLoginForm.valid || authservice.showLoader"
                                        autofocus [class.loader--text]="authservice.showLoader" class="ti-btn ti-btn-primary{{
        disabled
        }}">Sign In</button>
                                </div>
                                <div class="text-center">
                                    <p class="text-textmuted dark:text-textmuted/50 !mt-4 !mb-0">Dont have an account? <a
                                            href="javascript:void(0);" class="text-primary">Sign
                                            Up</a>
                                    </p>
                                </div>
                            </form>
                        </div>
                        <div id="segment-2" class="hidden" role="tabpanel" aria-labelledby="segment-item-2">
                            <form [formGroup]="firebaseLoginForm" (ngSubmit)="login()">

                                <div class="flex items-center justify-center mb-3">
                                    <span class="auth-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" id="password">
                                            <path fill="#6446fe"
                                                d="M59,8H5A1,1,0,0,0,4,9V55a1,1,0,0,0,1,1H59a1,1,0,0,0,1-1V9A1,1,0,0,0,59,8ZM58,54H6V10H58Z"
                                                class="color1d1f47 svgShape"></path>
                                            <path fill="#6446fe"
                                                d="M36,35H28a3,3,0,0,1-3-3V27a3,3,0,0,1,3-3h8a3,3,0,0,1,3,3v5A3,3,0,0,1,36,35Zm-8-9a1,1,0,0,0-1,1v5a1,1,0,0,0,1,1h8a1,1,0,0,0,1-1V27a1,1,0,0,0-1-1Z"
                                                class="color0055ff svgShape"></path>
                                            <path fill="#6446fe"
                                                d="M36 26H28a1 1 0 0 1-1-1V24a5 5 0 0 1 10 0v1A1 1 0 0 1 36 26zm-7-2h6a3 3 0 0 0-6 0zM32 31a1 1 0 0 1-1-1V29a1 1 0 0 1 2 0v1A1 1 0 0 1 32 31z"
                                                class="color0055ff svgShape"></path>
                                            <path fill="#6446fe"
                                                d="M59 8H5A1 1 0 0 0 4 9v8a1 1 0 0 0 1 1H20.08a1 1 0 0 0 .63-.22L25.36 14H59a1 1 0 0 0 1-1V9A1 1 0 0 0 59 8zm-1 4H25l-.21 0a1.09 1.09 0 0 0-.42.2L19.73 16H6V10H58zM50 49H14a1 1 0 0 1-1-1V39a1 1 0 0 1 1-1H50a1 1 0 0 1 1 1v9A1 1 0 0 1 50 49zM15 47H49V40H15z"
                                                class="color1d1f47 svgShape"></path>
                                            <circle cx="19.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="24.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="29.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="34.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="39.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <circle cx="44.5" cy="43.5" r="1.5" fill="#6446fe"
                                                class="color0055ff svgShape">
                                            </circle>
                                            <path fill="#6446fe"
                                                d="M60 9a1 1 0 0 0-1-1H28.81l2.37-2.37A19.22 19.22 0 0 1 60 31zM35.19 56l-2.37 2.37A19.22 19.22 0 0 1 4 33V55a1 1 0 0 0 1 1z"
                                                opacity=".3" class="color0055ff svgShape"></path>
                                        </svg>
                                    </span>
                                </div>
                                <p class="h4 !font-semibold !mb-0 text-center">Sign In</p>

                                <p class="!mb-3 text-textmuted dark:text-textmuted/50  font-normal text-center">Welcome
                                    back
                                    Jhon !</p>
                                <div class="grid grid-cols-12 gap-y-4">
                                    <div class="xl:col-span-12 col-span-12">
                                        <label for="signup-firstname" class="ti-form-label text-default">User
                                            Name</label>
                                        <input type="email" class="form-control form-control-lg !pe-0" id="signup-firstname"
                                            placeholder="User Name" autocomplete formControlName="username" required>
                                    </div>
                                    <div class="xl:col-span-12 col-span-12">
                                        <label for="signin-password" class="ti-form-label text-default block">Password
                                        </label>
                                        <a href="javascript:void(0);"
                                            class="float-end text-danger opacity-50 font-medium text-[0.75rem]">Forget
                                            password ?</a>
                                        <div class="relative">
                                            <input type="password"
                                                [type]="visibilityMap['Firebase'] ? 'text' : 'password'"
                                                class="form-control form-control-lg" id="signin-password"
                                                placeholder="password" autocomplete placeholder="password" autocomplete
                                                placeholder="Password" formControlName="password" required>
                                            <a href="javascript:void(0);"
                                                class="show-password-button text-textmuted dark:text-textmuted/50"
                                                (click)="toggleVisibility('Firebase')"><i
                                                    class="{{ iconMap['Firebase'] }} align-middle"></i></a>

                                        </div>
                                        <div class="mt-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value=""
                                                    id="defaultCheck1">
                                                <label
                                                    class="form-check-label text-textmuted dark:text-textmuted/50 font-normal text-[0.75rem]"
                                                    for="defaultCheck1">
                                                    Remember password ?
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-center my-4 authentication-barrier">
                                    <span class="opacity-40 text-[0.6875rem]">OR SignIn With</span>
                                </div>
                                <div class="flex items-center justify-center gap-3 mb-3 flex-wrap">
                                    <button type="button" class="ti-btn ti-btn-primary ti-btn-md ti-btn-icon"> <i
                                            class="ti ti-brand-google text-lg"></i>
                                    </button>
                                    <button type="button" class="ti-btn ti-btn-secondary ti-btn-md ti-btn-icon"> <i
                                            class="ti ti-mail  text-lg"></i>
                                    </button>
                                    <button type="button" class="ti-btn ti-btn-success ti-btn-md ti-btn-icon"> <i
                                            class="ti ti-brand-facebook  text-lg"></i>
                                    </button>
                                </div>
                                <div class="grid mt-4">
                                    <button type="submit"
                                        [disabled]="!firebaseLoginForm.valid || authservice.showLoader" autofocus
                                        [class.loader--text]="authservice.showLoader" class="ti-btn ti-btn-primary{{
                    disabled
                }}">Sign In</button>
                                </div>
                                <div class="text-center">
                                    <p class="text-textmuted dark:text-textmuted/50 !mt-4 !mb-0">Dont have an account? <a
                                            href="javascript:void(0);" class="text-primary">Sign
                                            Up</a>
                                    </p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>
