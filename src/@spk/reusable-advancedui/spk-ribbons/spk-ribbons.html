<div class="box  {{mainClass()}}">
    <div class="box-body  {{bodyClass()}}">
        <div class="{{ribbonClass()}}">
            <ng-content />
        </div>

        @if (!!topTitle()) {

        <div class="card-subtitle font-semibold  {{textAlignment()}}">{{topTitle()}}</div>
        <span class="block {{descriptionClass()}}"> {{description()}}</span>
        }
        @if(!!bottomTitle()!){

        <span class="block {{descriptionClass()}}">{{description()}}</span>
        <div class="card-subtitle font-semibold {{textAlignment()}}">{{bottomTitle()}}</div>
        }
    </div>
</div>
