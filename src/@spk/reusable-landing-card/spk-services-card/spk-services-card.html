<div class="box landing-card">
  <div class="box-body text-center">
      <div class="mb-4">
          <span
              class="svg-gradient avatar avatar-lg  mx-auto svg-container {{ bgColor() }} svg-white" [innerHTML]="svg()">
          </span>
      </div>
      <h6 class="!font-semibold">{{ title() }}</h6>
      <p class="text-[15px] text-textmuted dark:text-textmuted/50 mb-0">{{ description() }}</p>
  </div>
