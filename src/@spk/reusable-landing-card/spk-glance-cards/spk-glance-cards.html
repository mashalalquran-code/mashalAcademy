<div class="box landing-card landingmain !border !border-defaultborder dark:!border-defaultborder/10 dark:!bg-light">
  <div class="box-body">
      <div class="mb-4">
          <span class="avatar avatar-xl {{ outerColor() }}">
              <span class="avatar avatar-lg {{ innerColor() }} svg-white">
                  <i class="{{ icon() }} text-[25px]"></i>
              </span>
          </span>
      </div>
      <h5 class="font-semibold">{{ title() }}</h5>
      <p class="text-sm text-textmuted dark:text-textmuted/50 mb-2">{{ description() }}</p>
      <a href="javascript:void(0);" class="font-medium text-primary">Read More <i
              class="ti ti-arrow-narrow-right ms-2 text-[1.25rem] align-middle"></i></a>
  </div>
</div>
