<div class="{{mainClass()}} "  gallerize>
    @for (image of imageData(); track $index) {
        <div class="{{colClass()}}">
            <a href="javascript:void(0);" class="glightbox box !border border-defaultborder dark:border-defaultborder/10 {{lightboxClass()}}" data-gallery="gallery1">
                <img  [src]="image.srcUrl" alt="image" >
                @if(image.galleryInfo){
                    <div class="p-3 text-center">
                      <div class="flex items-center justify-center gap-1">
                          <div class="avatar avatar-sm {{ image.galleryInfo.bgColor }} border avatar-rounded rounded-sm  border-defaultborder dark:border-defaultborder/10">
                              <img [src]="image.galleryInfo.image" alt="">
                          </div>
                          <div class="figure-caption text-[13px] mb-1 font-semibold text-dark">
                            {{ image.galleryInfo.title }}</div>
                      </div>
                      <div class="text-xs text-textmuted dark:text-textmuted/50">{{image.galleryInfo.desc }}</div>
                  </div>
                }
            </a>
        </div>
    }
    @if(badge()){
        @for (image of imageData1(); track $index) {
            <a href="javascript:void(0);" class="glightbox box border-0 mb-0" data-gallery="gallery1" data-title="Compact Laptop (1/5)" data-type="image" data-draggable="true">
                <div class="ecommerce-gallery flex text-center">
                    <span class="badge bg-primarytint2color tag-badge">{{badge()}}</span>
                    <img [src]="image.srcUrl" alt="image" class="">
                    <span class="p-4 py-2 rounded-md text-white view-lightbox ">View More Images</span>
                </div>
            </a>
        }
    }
    <ng-content />
</div>
