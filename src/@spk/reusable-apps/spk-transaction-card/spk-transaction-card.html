<div class="grid 2xl:grid-cols-5 xl:grid-cols-3 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-x-6">
    @for(data of transactionData(); track $index){
    <div class="col">
        <div class="box">
            <div class="box-body">
                <div class="">
                    <div class="flex items-center justify-between">
                        <span class="avatar avatar-md {{ data.bgIconColor }} svg-white"
                            [innerHTML]="sanitizeIcon(data.svg)">

                        </span>
                        <div id="newtaskschart">
                            <spk-apexcharts [chartOptions]="data.chartData" />
                        </div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="block mb-1 mt-2">{{ data.title }}</span>
                            <div class="flex items-center gap-2">
                                <h3 class="font-medium mb-0">
                                    @if(data.dollar){$}<span class="count-up"  [countUp]="data.value"></span>@if(data.ksymbol){k}
                                </h3>
                                <span class="badge {{ data.bgCountColor }}">{{ data.count }}</span>
                            </div>
                        </div>
                        <div>
                            <span class="font-semibold mb-1 text-textmuted dark:text-textmuted/50">This Year</span>
                            <span class="block {{ data.percentageClass }} text-[13px]"><i
                                    class="{{ data.arrowPos }}"></i>{{ data.percentage}}%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    }
</div>
