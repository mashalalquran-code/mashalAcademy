<div class="box">
  <div class="box-body">
    <div class="p-3 bg-light">
      <div class="flex items-center justify-between mb-3 flex-wrap">
        <div class="flex items-center">
          <div class="me-2">
            <span class="avatar avatar-md avatar-rounded bg-{{crypto().colorClass }} p-2 svg-white" [innerHTML]="sanitizeIcon(crypto().svg)" >

            </span>
          </div>
          <div class="mb-0 font-medium">
            {{crypto().cryptoName }}
          </div>
        </div>
        <p class="text-{{crypto().percentageColor }} !mb-0 font-weight-normal">
          <span class="numberfont">{{crypto().percentage }}</span> today
        </p>
      </div>
      <div class="flex align-items-end justify-between flex-wrap">
        <div>
          <p class="!mb-1">{{crypto().title }}</p>
          <p class="text-xl !mb-0 font-medium leading-none text-{{ crypto().colorClass }}">{{crypto().value}}
          </p>
        </div>
 
          <spk-apexcharts [chartOptions]="crypto().chartData" />
   
      </div>
    </div>
  </div>
</div>
