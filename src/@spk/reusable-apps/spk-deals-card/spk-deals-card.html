
<div class="box">
  <div class="box-body">
      <div>
          <div class="flex items-center gap-2 flex-wrap mb-2">
              <div class="leading-none">
                  <span class="avatar avatar-sm avatar-rounded">
                      <img [src]="avatarUrl()" alt="">
                  </span>
              </div>
              <div>
                  <span class="block text-textmuted dark:text-textmuted/50">{{ name()  }}</span>
                  <a href="javascript:void(0);" class="company-name">{{ companyName() }}</a>
              </div>
          </div>
          <div class="px-3 py-2 rounded-sm bg-light border border-defaultborder dark:border-defaultborder/10 flex items-center justify-between flex-wrap">
              <div>{{ amount() }}</div>
              <div class="text-textmuted dark:text-textmuted/50 text-xs"><i class="ri-calendar-line me-1"></i>{{ timestamp() }}</div>
          </div>
      </div>
  </div>
</div>
