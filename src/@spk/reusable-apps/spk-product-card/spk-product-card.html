<div class="box card-style-2">
  <div class="box-body !p-0">
    <span class="badge rounded-sm py-1 top-left-badge {{discountBgcolor()}}">
      {{ discount() }}
    </span>

    <div class="card-img-top p-2 border-bottom border-block-end-dashed">
      <div class="btns-container-1 items-center gap-1">
        <div class="hs-tooltip ti-main-tooltip">
          <a [routerLink]="'/apps/ecommerce/product-details'"
            class="hs-tooltip-toggle ti-btn ti-btn-icon ti-btn-primary">
            <i class="ti ti-eye"></i>
            <span
              class="hs-tooltip-content ti-main-tooltip-content py-1 px-2 !bg-black !text-xs !font-medium !text-white shadow-sm"
              role="tooltip">
              Quick View
            </span>
          </a>
        </div>
        <div class="hs-tooltip ti-main-tooltip">
          <a routerLink="/apps/ecommerce/wishlist" class="hs-tooltip-toggle ti-btn ti-btn-icon ti-btn-secondary">
            <i class="ti ti-heart align-center"></i>
            <span
              class="hs-tooltip-content ti-main-tooltip-content py-1 px-2 !bg-black !text-xs !font-medium !text-white shadow-sm"
              role="tooltip">
              Add to Wishlist
            </span>
          </a>
        </div>
        <div class="hs-tooltip ti-main-tooltip">
          <a routerLink="/apps/ecommerce/cart" class="hs-tooltip-toggle ti-btn ti-btn-icon ti-btn-success">
            <i class="ti ti-shopping-cart"></i>
            <span
              class="hs-tooltip-content ti-main-tooltip-content py-1 px-2 !bg-black !text-xs !font-medium !text-white shadow-sm"
              role="tooltip">
              Move To Cart
            </span>
          </a>
        </div>
      </div>
      <div class="img-box-2 "  [ngClass]=" bgColor()">
        <img [src]="productImage()" alt="img" class="scale-img img-fluid w-full rounded-sm">
      </div>
    </div>

    <div class="p-3">
      <h6 class="mb-1 font-semibold text-base">
        <a [routerLink]="'/apps/ecommerce/product-details'">{{ productName() }}</a>
      </h6>
      <div class="flex items-end justify-between flex-wrap">
        <div class="flex-grow-1">
          <div class="flex items-baseline text-[11px]">
            <div class="min-w-fit-content">
              <span class=" text-warning"><i class="bi bi-star-fill"></i></span>
              <span class="mx-1 text-warning"><i class="bi bi-star-fill"></i></span>
              <span class="mx-1 text-warning"><i class="bi bi-star-fill"></i></span>
              <span class="mx-1 text-warning"><i class="bi bi-star-half"></i></span>
            </div>
            <p class="!mb-1 ms-1 min-w-fit-content text-textmuted dark:text-textmuted/50">
              <span>({{ratings()}}) </span> <span>Ratings</span>
            </p>
          </div>
          <a href="javascript:void(0);" class="text-primary1 text-[13px] font-semibold">{{ sellerName() }}</a>
        </div>
        <div class="min-w-fit-content">
          <h5 class="font-semibold mb-0">{{ productPrice() }}</h5>
          <span class="text-[13px] ms-2 text-textmuted dark:text-textmuted/50 line-through">{{ orginalPrice() }}</span>
        </div>
      </div>
    </div>

    <div class="p-3 pt-0 grid">
      <a [routerLink]="['/apps/ecommerce/cart']" class="ti-btn ti-btn-light">Add to Cart</a>
    </div>
  </div>
</div>
