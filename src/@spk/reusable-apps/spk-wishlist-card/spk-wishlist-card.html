
    <div class="box card-style-3">
      <div class="box-body p-3">
        <div class="grid grid-cols-12">
          <div class="col-span-4 pe-4">
            <div class="rounded-md">
              <a href="javascript:void(0);">
                <img [src]="image()" alt="img" class="img-fluid bg-light w-full rounded-sm" />
              </a>
            </div>
          </div>
          <div class="col-span-8">
            <div class="mb-2">
              <div class="flex-grow-1">
                <div class="mb-2 flex items-start justify-between flex-wrap">
                  <div>
                    <span [ngClass]="inStock() ? 'text-success' : 'text-danger'" class="font-semibold mb-2">
                      <i [ngClass]="inStock() ? 'ti ti-circle-check-filled me-1' : 'ti ti-circle-x-filled me-1'"></i>
                      {{ inStock() ? 'In Stock' : 'Out Of Stock' }}
                    </span>
                    <div class="flex items-baseline text-xs">
                      <div class="min-w-fit-content">
                        @for (star of [1, 2, 3, 4, 5]; track $index;let i = $index) {
                        <ng-container>
                          <i class="me-1 bi" [ngClass]="i < rating() ? 'bi-star-fill text-warning' : 'bi-star text-warning'"></i>
                        </ng-container>
                        }
                      </div>
                    </div>
                  </div>
                  <div class="flex items-baseline">
                    <h6 class="text-xl font-semibold mb-0">{{ price() }}</h6>
                    <span class="text-[13px] ms-2 text-textmuted dark:text-textmuted/50 line-through">{{ oldPrice() }}</span>
                  </div>
                </div>
                <h6 class="text-base mb-1 !font-semibold">
                  <a [routerLink]="['/apps/ecommerce/product-details']">{{ title() }}</a>
                </h6>
              </div>
            </div>
            <div class="flex items-center justify-between gap-2 mt-0">
              <a [routerLink]="['/apps/ecommerce/cart']" class="ti-btn ti-btn-soft-primary ti-btn-sm rounded-full">
                <i class="ti ti-shopping-cart-plus me-1"></i> Add Cart
              </a>
              <div class="hs-tooltip ti-main-tooltip">
                <a href="javascript:void(0);" class="hs-tooltip-toggle">
                  <i class="ti ti-heart me-1 text-primary text-lg"></i>
                  <span class="hs-tooltip-content ti-main-tooltip-content py-1 px-2 !bg-black !text-xs !font-medium !text-white shadow-sm" role="tooltip">
                    Wishlist
                  </span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
