
    <div class="box">
      <div class="box-body">
        <div class="flex items-start flex-wrap gap-3">
          <div>
            <span class="avatar avatar-md mx-2" [ngClass]="[bgColor(), customClass()]">
              <i [class]="icon() + ' text-xl'"></i>
            </span>
          </div>
          <div class="flex-auto">
            <span class="block mb-2">{{ title() }}</span>
            <h3 class="!font-semibold mb-2 leading-none">{{ count() | number}}</h3>
          </div>
          <spk-dropdowns [Customclass]="'ti-dropdown hs-dropdown'"  [class]="'hs-dropdown-toggle p-0'" 
          [Menuclass]="'ti-dropdown-menu hs-dropdown-menu hidden'" [Icon]="true" [IconClass]="'ri-more-2-fill text-lg text-textmuted dark:text-textmuted/50'">
          @for (option of dropdownOptions(); track $index) {   
             <li>
                <a class="ti-dropdown-item" href="javascript:void(0);">{{ option }}</a>
              </li>
            }
          </spk-dropdowns>
        </div>
      </div>
    </div>
