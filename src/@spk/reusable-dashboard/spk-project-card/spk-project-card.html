<div class="box">
  <div class="box-body !p-6">
    <div class="flex items-start justify-between flex-wrap gap-y-2">
      <div>
        <span class="block text-textmuted dark:text-textmuted/50 mb-2">{{ title() }}</span>
        <h3 class="font-semibold leading-none mb-0">
          {{ value() }}
          <span class="text-[13px] font-semibold ms-1 inline-flex items-center"
            [ngClass]="isPositive() ? 'text-success' : 'text-danger'">
            <i [class]="'ti ' + (isPositive() ? 'ti-arrow-narrow-up' : 'ti-arrow-narrow-down')"></i>
            {{ percentage() }}
          </span>
        </h3>
      </div>
      <div>
        <span class="avatar avatar-md" [ngClass]="'bg-' + color() + ' svg-white'">
          <i [innerHTML]="sanitizeIcon(icon())"></i>
        </span>
      </div>
    </div>
  </div>
</div>
