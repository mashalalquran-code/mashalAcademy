
    <div class="box">
      <div class="box-body">
        <div class="flex items-end gap-2 justify-between flex-wrap">
          <div>
            <span class="avatar avatar-md" [ngClass]="iconBgClass()" [innerHTML]="sanitizeIcon(iconSvg())"></span>
            <span class="block mb-1 mt-2">{{ title() }}</span>
            <h3 class="block font-semibold mb-0 leading-none">{{ value() }}</h3>
          </div>
          <div class="text-end">
            <span class="font-semibold mb-1 text-textmuted dark:text-textmuted/50">{{ subtitle() }}</span>
            <span [ngClass]="{
              'text-success': isUp(),
              'text-danger': !isUp()
            }" class="text-[13px] inline-flex items-center">
              <i class="ti" [ngClass]="isUp() ? 'ti-arrow-up' : 'ti-arrow-down'"></i>{{ change() }}
            </span>
          </div>
        </div>
      </div>
    </div>
