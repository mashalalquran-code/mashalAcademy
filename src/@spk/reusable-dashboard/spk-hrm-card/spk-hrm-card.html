<div class="box">
  <div class="box-body p-6">
    <div class="flex items-start gap-3">
      <div>
        <span class="avatar avatar-md" [ngClass]="iconBgColor()" [innerHTML]="sanitizeIcon(iconSvg())"></span>
      </div>
      <div class="flex items-start justify-between flex-auto flex-wrap">
        <div>
          <span class="block mb-1 font-medium">{{ title() }}</span>
          <h3 class="font-semibold mb-2">{{ count() }}</h3>
          <div class="text-[13px]">
            <span class="me-1 inline-flex items-center" [ngClass]="changeColor()">
              <i class="ti" [ngClass]="changeType() === 'up' ? 'ti-arrow-up' : 'ti-arrow-down'"></i>{{ change() }}
            </span>
            <span class="text-textmuted dark:text-textmuted/50 text-[13px]">{{ subtitle() }}</span>
          </div>
        </div>
        <div class="relative">
          <div [id]="chartId()">
            <spk-apexcharts [chartOptions]="chartOptions()" />
          </div>
          <h5 class="font-semibold my-1 chart-value" [ngClass]="chartTextColor()">{{ chartValue() }}</h5>
        </div>
      </div>
    </div>
  </div>
</div>
