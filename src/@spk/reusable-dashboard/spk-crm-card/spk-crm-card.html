
<div class="box overflow-hidden">
  <div class="box-body !p-0">
    <div class="!flex items-start flex-wrap gap-2 p-3 mb-1">
      <div>
        <span class="avatar avatar-md {{ data()?.iconClass }} svg-white" [appSvgReplace]="data()?.svgPath || ''">
        </span>
      </div>
      <div class="!flex-auto">
        <span class="block mb-1">{{ data()?.title }}</span>
        <h3 class="!.ti-dropdown-menufont-semibold mb-0 leading-none">{{ data()?.value }}</h3>
      </div>
      <div class="text-end">
        <span class="badge {{ data()?.changeClass }}">
          <i class="{{ data()?.changeIcon }} me-1"></i>{{ data()?.change }}
        </span>
      </div>
    </div>
    <spk-apexcharts  [id]="data()?.chartId" [chartOptions]="data()?.chartOptions" />
  </div>
</div>
