<div class="box">
    <div class="box-body !p-6">
      <div class="flex items-center gap-3 mb-4 flex-wrap">
        <div class="leading-none">
          <span class="avatar" [ngClass]="bgColor()">
            <i [class]="iconClass() + ' text-lg'"></i>
          </span>
        </div>
        <div class="flex-auto">
          <span class="block font-semibold">{{ name() }}</span>
          <span class="block text-textmuted dark:text-textmuted/50 text-[13px]">{{ company() }}</span>
        </div>
        <div class="text-end">
          <span class="text-[13px] text-textmuted dark:text-textmuted/50">{{ name() }}</span>
          <span
            class="text-[13px] block"
            [ngClass]="changeType() === 'up' ? 'text-success' : 'text-danger'"
          >
            {{ change() }}
          </span>
        </div>
      </div>
      <div class="flex items-end justify-between flex-wrap">
        <div>
          <span class="text-[13px] text-textmuted dark:text-textmuted/50 block mb-1">CURRENT VALUE</span>
          <h3 class="!font-semibold mb-0 leading-none">{{ value() }}</h3>
        </div>
        <div [id]="chartId()">
            <spk-apexcharts [chartOptions]="chartOptions()" />
        </div>
      </div>
    </div>
  </div>
