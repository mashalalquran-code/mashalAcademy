
    <div class="box">
      <div class="box-body">
        <div class="flex items-start justify-between flex-wrap">
          <div>
            <span class="block mb-0">{{ title() }}</span>
            <h3 class="!font-semibold mb-1">{{ value() }}</h3>
            <span class="block text-textmuted dark:text-textmuted/50 text-[13px]">
              {{ changeText() }}
              <span [ngClass]="isPositive() ? 'text-success' : 'text-danger'">
                <i class="ti" [ngClass]="isPositive() ? 'ti-arrow-narrow-up' : 'ti-arrow-narrow-down'"></i>
                {{ changeValue() }}
              </span>
            </span>
          </div>
          <div>
            <span class="avatar avatar-lg" [ngClass]="avatarClass()">
              <i [innerHTML]="sanitizeIcon(icon())"></i>
            </span>
          </div>
        </div>
      </div>
    </div>
