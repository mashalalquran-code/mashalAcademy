<div class="box">
    <div class="box-body">
      <div class="flex items-center justify-between">
        <div>
          <span class="block mb-1">{{ title() }}</span>
          <div class="flex items-center gap-2">
            <h3 class="font-semibold mb-0 leading-none">{{ value() }}</h3>
            <span
              class="text-[13px] inline-flex items-center"
              [ngClass]="percentageColor()"
            >
              {{ percentage() }}
              <i class="ti" [ngClass]="percentageType() === 'up' ? 'ti-arrow-up' : 'ti-arrow-down'"></i>
            </span>
          </div>
        </div>
        <div class="leading-none">
          <span class="avatar avatar-md" [ngClass]="bgColor()" [innerHTML]="sanitizeIcon(icon())"></span>
        </div>
      </div>
    </div>
    </div>
