<div class="box overlay-card  " [ngClass]="boxClass()">
  <!-- Image -->
  <img [src]="imgSrc()" class="card-img" alt="Image" />

  <!-- Overlay Content -->
  <div class="box-img-overlay flex flex-col p-0">
    <!-- Header -->
    @if (headerText()) {
      <div class="box-header !border-b !border-defaultborder/10">
        <div class="box-title !text-white">{{ headerText() }}</div>
      </div>
    }

    <!-- Body -->
    <div
      class="box-body text-white"
      [ngClass]="{ 'overflow-y-scroll sm:text-[0.87rem] text-[0.65rem]': scrollable() }"
      >
      @if (bodyAdditionalText()) {
        <div class="card-text text-white">{{ bodyAdditionalText() }}</div>
      }
      <div class="card-text !text-white">{{ bodyText() }}</div>
    </div>

    <!-- Footer -->
    @if (hasFooter()) {
      <div class="box-footer !text-white !border-t !border-defaultborder/10">
        {{ footerText() }}
      </div>
    }
  </div>
</div>
